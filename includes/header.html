    /* Grid de Matérias */
    #materias-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    /* Cards de Matérias */
    .materia-card {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;

      transition: transform 0.3s ease, box-shadow 0.3s ease;

    }

    }

    .materia-img {

      height: 200px;

      background: linear-gradient(45deg, #003366, #0066CC);
    }

    .materia-content {
      padding: 1.5rem;
    }

    .materia-card h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #428f9d;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .materia-meta {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 1rem;
      font-weight: 500;
    }

    .materia-resumo {
      font-size: 1rem;
      color: #374151;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    .materia-link {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 1rem;
      background: #42929d;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
      transition: background-color 0.3s ease;
    }

    .materia-link:hover {
      background: #003366;
    }

    .materia-link i {
      margin-left: 0.5rem;
    }

    /* Animações */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeInUp 1s ease-out;
    }

    /* Navegação Ativa */
    .nav-link.active {
      color: #42929d;
      font-weight: 500;
    }

    /* Hover Effects */
    .feature-card:hover,
    .course-card:hover,
    .news-card:hover {
      transform: translateY(-5px);
    }

    /* ===== MENU SANFONA MOBILE ===== */
    .accordion-item {
      border-bottom: 1px solid #e5e7eb;
    }

    .accordion-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 0;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .accordion-header:hover {
      color: #0066CC;
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      background-color: #fafafa;
      border-radius: 8px;
      margin-bottom: 0.5rem;
    }

    .accordion-content.active {
      max-height: 500px;
    }

    .accordion-chevron {
      transition: transform 0.3s ease;
      font-size: 0.75rem;
      color: #42929d;
    }

    .accordion-chevron.rotated {
      transform: rotate(180deg);
    }

    .accordion-link {
      display: block;
      padding: 0.75rem 1rem;
      color: #666666;
      transition: all 0.2s ease;
      border-left: 3px solid transparent;
    }

    .accordion-link:hover {
      color: #42929d;
      background-color: #ffffff;
      border-left-color: #42929d;
    }

    /* Menu Mobile Principal */
    #mobile-menu {
      transition: all 0.3s ease-in-out;
    }

    /* Responsividade */
    @media (max-width: 768px) {
      #materias-container {
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .materia-content {
        padding: 1rem;
      }

      .materia-img {
        height: 160px;
      }

      .text-5xl {
        font-size: 2.5rem;
      }

      .text-xl {
        font-size: 1.125rem;
      }
    }
  </style>

  <script>
    // Script do Menu Sanfona Mobile
    document.addEventListener("DOMContentLoaded", () => {
      // Toggle do menu mobile principal
      const mobileMenuButton = document.getElementById("mobile-menu-button");
      const mobileMenu = document.getElementById("mobile-menu");
      
      if (mobileMenuButton && mobileMenu) {
        mobileMenuButton.addEventListener("click", () => {
          mobileMenu.classList.toggle("hidden");
        });
      }

      // Accordion para submenus
      const accordionButtons = document.querySelectorAll("[data-accordion]");
      
      accordionButtons.forEach((button) => {
        button.addEventListener("click", (e) => {
          e.preventDefault();
          
          const accordionId = button.getAttribute("data-accordion");
          const accordionContent = document.getElementById(`${accordionId}-accordion`);
          const chevron = button.querySelector(".accordion-chevron");
          
          // Fecha outros accordions (opcional - remova se quiser permitir múltiplos abertos)
          document.querySelectorAll(".accordion-content").forEach((content) => {
            if (content !== accordionContent && content.classList.contains("active")) {
              content.classList.remove("active");
              const otherChevron = content.previousElementSibling?.querySelector(".accordion-chevron");
              if (otherChevron) otherChevron.classList.remove("rotated");
            }
          });
          
          // Toggle do accordion atual
          if (accordionContent) {
            accordionContent.classList.toggle("active");
          }
          
          if (chevron) {
            chevron.classList.toggle("rotated");
          }
        });
      });
    });
  </script>
