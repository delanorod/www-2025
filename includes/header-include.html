        .animate-fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        .titulo-destaque {
            color: var(--primary);
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
            text-align: center;
            position: relative;
        }
        
        .titulo-destaque::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            margin: 1rem auto;
            border-radius: 2px;
        }
        
        /* Modal Styles */
        .modal-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        
        .modal-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        .modal-visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        
        .bg-primary-gradient {
            background: linear-gradient(135deg, #42929d 0%, #5ba3b2 100%);
        }
        
        .bg-highlight-gradient {
            background: linear-gradient(135deg, rgba(66, 146, 157, 0.1) 0%, rgba(91, 163, 178, 0.1) 100%);
        }
        
        /* Typography improvements */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
        }
        
        p {

            text-align: justify;
        }
        
        .indent-8 {

        }
        
        /* List styling */

        /* Responsive adjustments */

            .artigo-estilo {
                padding: 1.5rem;
                margin: 1rem;
            }
            
            .titulo-destaque {
                font-size: 2rem;
            }
        }
        
        /* Navigation Styles */
        .nav-link {
            text-decoration: none;
            display: inline-block;
            padding: 0.5rem 0;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            border-bottom-color: var(--puc-light-blue);
        }
        
        /* Mobile Menu Styles */
        .mobile-submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .mobile-submenu.active {

        }
        
        .mobile-menu-chevron {
            transition: transform 0.3s ease;
        }
        
        .mobile-menu-chevron.rotated {

        }
        
        /* Dropdown hover styles for desktop */
        .group:hover .group-hover\:opacity-100 {
