<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Google Sheets na Página</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 800px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
    }
  </style>
</head>
<body>
  <h1>Dados da Planilha Google Sheets</h1>
  <div id="saida">Carregando...</div>



  <script>
    // 🔹 Substitua pelo ID da sua planilha
    const SHEET_ID = "1KtKF2EMfuzPlr3p6g5fc0x5bZ43DYSR3W9XB6PSyPCk";
    const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

    fetch(URL)
      .then(res => res.text())
      .then(txt => {
        // A resposta do Google vem "embrulhada", então limpamos
        const json = JSON.parse(txt.substr(47).slice(0, -2));

        // Montar a tabela
        let html = "<table>";

        // Cabeçalho
        if (json.table.cols) {
          html += "<tr>";
          json.table.cols.forEach(col => {
            if (col.label) {
              html += `<th>${col.label}</th>`;
            }
          });
          html += "</tr>";
        }

        // Linhas de dados
        json.table.rows.forEach(row => {
          html += "<tr>";
          row.c.forEach(cell => {
            html += `<td>${cell ? cell.v : ""}</td>`;
          });
          html += "</tr>";
        });

        html += "</table>";

        document.getElementById("saida").innerHTML = html;
      })
      .catch(err => {
        document.getElementById("saida").innerHTML = "Erro ao carregar a planilha.";
        console.error(err);
      });
  </script>
</body>
</html>
