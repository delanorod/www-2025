<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Automático - IEPUC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">IEPUC na Mídia</h1>

        <!-- Loading indicator -->
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <p class="mt-2 text-gray-600">Carregando matérias...</p>
        </div>

        <!-- Error message -->
        <div id="error" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">
            <p>Erro ao carregar as matérias. Tente novamente mais tarde.</p>
        </div>

        <!-- Blog Posts Grid -->
        <div class="grid grid-cols-1 gap-8" id="blogue">
            <!-- As matérias serão inseridas aqui automaticamente -->
        </div>
    </div>

    <script>
        // 🔹 ID da sua planilha do Google Sheets
        const SHEET_ID = "1KtKF2EMfuzPlr3p6g5fc0x5bZ43DYSR3W9XB6PSyPCk";
        const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        // Função para formatar data no padrão brasileiro "dia de mês de ano"
        function formatDate(dateStr) {
            if (!dateStr) return '';

            const monthNames = [
                'janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
                'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'
            ];

            try {
                let day, month, year;

                // Caso venha no formato Google Sheets: Date(2025,7,4)
                const match = /Date\((\d+),(\d+),(\d+)\)/.exec(dateStr);
                if (match) {
                    year = parseInt(match[1]);
                    month = parseInt(match[2]); // Google Sheets usa mês base 0
                    day = parseInt(match[3]);
                    return `${day} de ${monthNames[month]} de ${year}`;
                }

                // Caso seja formato DD/MM/AAAA ou DD.MM.AAAA
                const parts = dateStr.split(/[/.]/);
                if (parts.length === 3) {
                    day = parseInt(parts[0]);
                    month = parseInt(parts[1]) - 1; // Converter para base 0
                    year = parseInt(parts[2]);

                    if (day >= 1 && day <= 31 && month >= 0 && month <= 11 && year > 1900) {
                        return `${day} de ${monthNames[month]} de ${year}`;
                    }
                }

                // Tentar criar Date a partir da string
                const date = new Date(dateStr);
                if (!isNaN(date.getTime())) {
                    day = date.getDate();
                    month = date.getMonth();
                    year = date.getFullYear();
                    return `${day} de ${monthNames[month]} de ${year}`;
                }

            } catch (error) {
                console.warn('Erro ao formatar data:', dateStr, error);
            }

            // Se não conseguir formatar, retorna original
            return dateStr;
        }

        // Função auxiliar para converter data em objeto Date (para ordenação)
        function parseDate(dateValue) {
            if (!dateValue) return new Date(0);

            try {
                // Caso venha no formato Google: Date(2025,7,4)
                if (typeof dateValue === "string" && dateValue.includes("Date(")) {
                    const match = /Date\((\d+),(\d+),(\d+)\)/.exec(dateValue);
                    if (match) {
                        const year = parseInt(match[1]);
                        const month = parseInt(match[2]); // Google já vem base 0
                        const day = parseInt(match[3]);
                        return new Date(year, month, day);
                    }
                }

                // Caso seja objeto Date
                if (dateValue instanceof Date) {
                    return dateValue;
                }

                // Caso seja string no formato dd/mm/aaaa ou dd.mm.aaaa
                if (typeof dateValue === "string") {
                    const parts = dateValue.split(/[/.]/);
                    if (parts.length === 3) {
                        const day = parseInt(parts[0]);
                        const month = parseInt(parts[1]) - 1; // Converter para base 0
                        const year = parseInt(parts[2]);
                        return new Date(year, month, day);
                    }
                }

                // Tentar interpretar como data padrão
                const d = new Date(dateValue);
                if (!isNaN(d.getTime())) return d;

            } catch (error) {
                console.warn('Erro ao converter data para ordenação:', dateValue, error);
            }

            // Se não conseguir interpretar, retorna data mínima
            return new Date(0);
        }

        // Função para determinar a cor da tag baseada na categoria
        function getCategoryColor(category) {
            const colors = {
                'Petróleo & Gás': 'bg-blue-100 text-blue-800',
                'Energia': 'bg-green-100 text-green-800',
                'Economia': 'bg-yellow-100 text-yellow-800',
                'Tecnologia': 'bg-purple-100 text-purple-800',
                'Política': 'bg-red-100 text-red-800',
                'Meio Ambiente': 'bg-emerald-100 text-emerald-800',
                'default': 'bg-gray-100 text-gray-800'
            };
            return colors[category] || colors['default'];
        }

        // Função para criar um card de matéria
        function createArticleCard(article) {
            const categoryColor = getCategoryColor(article.categoria);

            return `
                <article class="bg-white rounded-lg shadow-md overflow-hidden transition-transform duration-300 hover:shadow-xl">
                    <div class="md:flex">
                        <div class="md:flex-shrink-0 md:w-64">
                            <img class="h-48 w-full object-contain bg-white md:h-full md:w-64"
                                 src="${article.imagem || 'https://via.placeholder.com/256x192?text=Sem+Imagem'}"
                                 alt="${article.titulo}"
                                 onerror="this.src='https://via.placeholder.com/256x192?text=Sem+Imagem'">
                        </div>
                        <div class="p-6">
                            <div class="flex items-center text-sm text-gray-500 mb-2">
                                <span class="mr-4">${article.veiculo || 'Veículo não informado'}</span>
                                <span><i class="far fa-calendar-alt mr-1"></i> ${formatDate(article.data)}</span>
                            </div>
                            <h3 class="text-xl font-bold text-gray-900 mb-3">
                                <a href="${article.link || '#'}"
                                   class="hover:text-blue-700 transition-colors"
                                   ${article.link ? 'target="_blank" rel="noopener noreferrer"' : ''}>
                                    ${article.titulo || 'Título não disponível'}
                                </a>
                            </h3>
                            <p class="text-gray-600 mb-4">
                                ${article.resumo || 'Resumo não disponível.'}
                            </p>
                            <div class="flex items-center justify-between">
                                <span class="${categoryColor} text-xs px-2.5 py-0.5 rounded">
                                    ${article.categoria || 'Geral'}
                                </span>
                                ${article.link ? `
                                    <a href="${article.link}"
                                       target="_blank"
                                       rel="noopener noreferrer"
                                       class="text-blue-600 hover:text-blue-800 font-medium flex items-center">
                                        Ler matéria completa <i class="ml-1 fas fa-arrow-right"></i>
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </article>
            `;
        }

        // Função principal para carregar as matérias
        function loadArticles() {
            const loadingElement = document.getElementById('loading');
            const errorElement = document.getElementById('error');
            const blogueElement = document.getElementById('blogue');

            fetch(URL)
                .then(res => res.text())
                .then(txt => {
                    // A resposta do Google vem "embrulhada", então limpamos
                    const json = JSON.parse(txt.substr(47).slice(0, -2));

                    // Esconder loading
                    loadingElement.style.display = 'none';

                    if (!json.table || !json.table.rows || json.table.rows.length === 0) {
                        throw new Error('Nenhuma matéria encontrada');
                    }

                    // Mapear as colunas (assumindo: Título, Veículo, Data, Link, Imagem, Categoria, Resumo)
                    const articles = json.table.rows.map(row => {
                        const cells = row.c || [];
                        const dcell = cells[2] || {}; // célula da Data
                        const rawDate = (dcell && (dcell.f || dcell.v)) || ""; // usa 'f' primeiro, depois 'v'

                        return {
                            titulo: cells[0]?.v || "",
                            veiculo: cells[1]?.v || "",
                            data: rawDate,
                            link: cells[3]?.v || "",
                            imagem: cells[4]?.v || "",
                            categoria: cells[5]?.v || "",
                            resumo: cells[6]?.v || ""
                        };
                    });

                    // Filtrar artigos vazios
                    const validArticles = articles.filter(article => article.titulo && article.titulo.trim() !== '');

                    if (validArticles.length === 0) {
                        blogueElement.innerHTML = `
                            <div class="col-span-full text-center py-12">
                                <p class="text-gray-500 text-lg">Nenhuma matéria disponível no momento.</p>
                            </div>
                        `;
                        return;
                    }

                    // Ordenar por data (mais recentes primeiro)
                    validArticles.sort((a, b) => {
                        const dateA = parseDate(a.data);
                        const dateB = parseDate(b.data);
                        return dateB - dateA;
                    });

                    // Gerar HTML dos cards
                    const articlesHTML = validArticles.map(article => createArticleCard(article)).join('');
                    blogueElement.innerHTML = articlesHTML;

                })
                .catch(err => {
                    console.error('Erro ao carregar matérias:', err);
                    loadingElement.style.display = 'none';
                    errorElement.classList.remove('hidden');

                    // Mostrar matéria de exemplo em caso de erro
                    const today = new Date();
                    const exampleDate = `${today.getDate()} de ${['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'][today.getMonth()]} de ${today.getFullYear()}`;

                    blogueElement.innerHTML = `
                        <article class="bg-white rounded-lg shadow-md overflow-hidden transition-transform duration-300 hover:shadow-xl">
                            <div class="md:flex">
                                <div class="md:flex-shrink-0 md:w-64">
                                    <img class="h-48 w-full object-contain bg-white md:h-full md:w-64"
                                         src="https://via.placeholder.com/256x192?text=Exemplo"
                                         alt="Matéria de exemplo">
                                </div>
                                <div class="p-6">
                                    <div class="flex items-center text-sm text-gray-500 mb-2">
                                        <span class="mr-4">Veículo de Exemplo</span>
                                        <span><i class="far fa-calendar-alt mr-1"></i> ${exampleDate}</span>
                                    </div>
                                    <h3 class="text-xl font-bold text-gray-900 mb-3">
                                        <a href="#" class="hover:text-blue-700 transition-colors">
                                            Matéria de exemplo - Configure sua planilha do Google Sheets
                                        </a>
                                    </h3>
                                    <p class="text-gray-600 mb-4">
                                        Este é um exemplo de como as matérias aparecerão quando a planilha estiver configurada corretamente.
                                    </p>
                                    <div class="flex items-center justify-between">
                                        <span class="bg-gray-100 text-gray-800 text-xs px-2.5 py-0.5 rounded">Exemplo</span>
                                        <span class="text-gray-500 text-sm">Configure a planilha para ver as matérias</span>
                                    </div>
                                </div>
                            </div>
                        </article>
                    `;
                });
        }

        // Carregar as matérias quando a página carrega
        document.addEventListener('DOMContentLoaded', loadArticles);

        // Opcional: Recarregar a cada 5 minutos
        setInterval(loadArticles, 5 * 60 * 1000);
    </script>
</body>
</html>
